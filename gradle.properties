org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official

# Vosk model to load from assets/. Must match the folder name under app/src/main/assets/.
# Available models: https://alphacephei.com/vosk/models
# Italian (default): vosk-model-small-it-0.22  →  vosk-model-it
# English:           vosk-model-small-en-us-0.15 →  vosk-model-en
vosk.model=vosk-model-it
